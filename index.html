<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Nattapong · Portfolio</title>
    <!-- The typeface Pawmely actually ships (verified: the prototype requests
         IBMPlexSansThaiLooped-{Regular,Medium,SemiBold,Bold}.ttf). Loaded here
         so the Typography specimen is set IN the face it documents rather than
         merely naming it. Same four weights, nothing more. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The site's own UI face. Loopless Thai (ไม่มีหัว), which the previous stack
         never had: 'Google Sans' carries no Thai, so every Thai string fell back
         to the OS face — Thonburi on macOS, looped. Anuphan is variable
         (wght 100-700) and drawn for interface text, so the 12px captions and the
         clamp(32px,4.5vw,64px) titles come from one file. It carries Latin too,
         so headings that mix scripts stay in one voice.
         This is the SITE's typeface only — the Pawmely Typography specimen stays
         set in IBM Plex Sans Thai Looped below, because that is the face that
         project actually ships. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Anuphan:wght@100..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- The hero's pressure headline. Noto Sans Thai is the one family on Google
         Fonts that is VARIABLE (wght 100-900, wdth 62.5-100%) and carries both
         Thai and Latin, so the same headline can flip language mid-word and keep
         reacting to the cursor identically on both sides. It has no `ital` axis —
         Thai has no italic — so that axis stays off.
         Loaded here rather than through the component's own injected `@import`:
         one request for the app instead of one per mount, and not
         render-blocking behind a style element. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wdth,wght@62.5..100,100..900&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/Portfolio/assets/index-0Wxby-Xn.js"></script>
    <link rel="stylesheet" crossorigin href="/Portfolio/assets/index-CaSJDvCM.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
